[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "droidasc"
version = "0.1.1.post5"
description = "ASC on-demand Android and JVM decompilation and bytecode search for Agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "axml>=0.0.2",
    "mutf8>=1.0.6",
]

[project.scripts]
droidasc = "droidasc:main"

[tool.setuptools.packages.find]
include = ["droidasc", "droidasc.*", "dadguard", "dadguard.*"]

[tool.setuptools.package-data]
"droidasc" = ["py.typed"]
"droidasc.jvm" = ["CfrWorker.java"]
