name: Tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      baseline_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Checkout performance baseline
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || (github.event_name == 'push' && github.ref_name == 'dev-0.1.0' && github.repository) || 'MG1937/ASC' }}
          ref: ${{ inputs.baseline_sha || github.event.pull_request.base.sha || (github.event_name == 'push' && github.ref_name == 'dev-0.1.0' && github.event.before) || 'dev-0.1.0' }}
          path: .performance-base
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Install legacy baseline dependencies for performance comparison
        run: python -m pip install -r .performance-base/requirements.txt
      - run: python -m pip check
      - name: Prepare JVM test backend
        run: |
          javac -version
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import urllib.request
          path = Path(os.environ['RUNNER_TEMP']) / 'cfr-0.152.jar'
          urllib.request.urlretrieve('https://www.benf.org/other/cfr/cfr-0.152.jar', path)
          expected = 'f686e8f3ded377d7bc87d216a90e9e9512df4156e75b06c655a16648ae8765b2'
          if hashlib.sha256(path.read_bytes()).hexdigest() != expected:
              raise SystemExit('CFR checksum mismatch')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'ASC_TEST_CFR_JAR={path}\n')
          PY
      - name: Unit tests (no skips)
        run: python tests/run_tests.py --require-decompiler --require-jvm --suite unit
      - name: Integration tests (no skips)
        run: python tests/run_tests.py --require-decompiler --require-jvm --suite integration
      - name: Reject material performance regressions against the target branch
        run: python tests/benchmark_compare.py --baseline .performance-base --samples 31
      - name: Check cold-process startup with --debug
        run: python tests/benchmark_startup.py --samples 9 --max-total-ms 100 --max-wall-ms 250
      - name: Check supplied DEX benchmarks and 0.0880 s budget
        run: python tests/benchmark_reference.py --samples 9
      - name: Upload benchmark timings and raw debug logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: benchmarks-python-${{ matrix.python-version }}
          path: |
            artifacts/startup/
            artifacts/reference/
            artifacts/comparison/
          if-no-files-found: warn
      - name: Build source release preview
        if: matrix.python-version == '3.12'
        run: python scripts/build_release.py v0.1.0 --output dist
      - name: Upload source release preview
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: source-release-preview
          path: dist/
          if-no-files-found: error
